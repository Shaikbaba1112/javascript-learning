<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Myntra</div>
        <nav>
            <a href="">Men</a>
            <a href="">Women</a>
            <a href="">Kids</a>
            <a href="">Beauty</a>
        </nav>
        <div class="right">
        <div class="search-box">
            <input type="text" id="search" placeholder="Search for products">
        </div>
        <div class="cart">Cart: <span id="cartCount">0</span></div>
        </div>
    </header>
    <div class="container">
        <h2>Trending Products</h2>
        <div class="products" id="productList">
            <div class="card" data-name="T-Shirt">
                <img src="https://images.unsplash.com/photo-1581655353564-df123a1eb820?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8dCUyMHNoaXJ0c3xlbnwwfHwwfHx8MA%3D%3D" alt="T-Shirt">
                <div class="card-content">
                    <h4>T-Shirt</h4>
                    <div class="price">499</div>
                    <button onclick="addToCart()">Add to Cart</button>
                </div>
            </div>
            <div class="card" data-name="Jeans">
                <img src="https://images.unsplash.com/photo-1714729382668-7bc3bb261662?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTJ8fGplYW5zfGVufDB8fDB8fHww" alt="Jeans">
                <div class="card-content">
                    <h4>Jeans</h4>
                    <div class="price">999</div>
                    <button onclick="addToCart()">Add to Cart</button>
                </div>
            </div>
            <div class="card" data-name="Shoes">
                <img src="https://media.istockphoto.com/id/626469336/photo/big-collection-of-different-sport-shoes.webp?a=1&b=1&s=612x612&w=0&k=20&c=gh9wlsDYqq0SoA76DKxSue49pDOoxt4rc5U-13n1dv8=" alt="Shoes">
                <div class="card-content">
                    <h4>Shoes</h4>
                    <div class="price">1499</div>
                    <button onclick="addToCart()">Add to Cart</button>
                </div>
            </div>
            <div class="card" data-name="Jacket">
                <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8amFja2V0fGVufDB8fDB8fHww" alt="Jacket">
                <div class="card-content">
                    <h4>Jacket</h4>
                    <div class="price">1999</div>
                    <button onclick="addToCart()">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>
    <script src="notes.js"></script>
    <script src="assignment.js"></script>
    <script src="script.js"></script>
</body>
</html>
